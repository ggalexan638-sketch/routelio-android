plugins {
    id 'com.android.application'
}

android {
    namespace 'de.routelio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.routelio.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
}
